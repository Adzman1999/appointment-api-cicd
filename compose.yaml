services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: appointment
      POSTGRES_PASSWORD: local_docker_password
      POSTGRES_DB: appointment_docker
    ports:
      - "5433:5432"
    volumes:
      - appointment_docker_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment -d appointment_docker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://appointment:local_docker_password@db:5432/appointment_docker
      JWT_SECRET: local-docker-secret-change-this-to-at-least-32-characters
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "./node_modules/.bin/node-pg-migrate up -m migrations &&
             npm start"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  appointment_docker_data:
