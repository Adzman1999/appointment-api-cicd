name: CI and Docker Image

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: appointment
          POSTGRES_PASSWORD: appointment_password
          POSTGRES_DB: appointment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointment -d appointment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 8000
      DATABASE_URL: postgres://appointment:appointment_password@localhost:5432/appointment_test
      JWT_SECRET: ci-test-secret-at-least-32-characters-long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create CI test environment file
        run: |
          cat > .env.test <<'ENVEOF'
          NODE_ENV=test
          PORT=8000
          DATABASE_URL=postgres://appointment:appointment_password@localhost:5432/appointment_test
          JWT_SECRET=ci-test-secret-at-least-32-characters-long
          ENVEOF

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and HTTP tests
        run: npm test

      - name: Run database migrations
        run: npm run migrate:test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Run HTTP E2E tests
        run: npm run test:e2e

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            --tag appointment-api-cicd:ci \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            .

      - name: Verify Docker image exists
        run: docker image inspect appointment-api-cicd:ci

  publish-image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
